[package]
name = "nota-site-gen"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Mustafa Dara Özevin"]
description = "Lightweight pure-Rust static site generator for Obsidian vaults and Typst PDF outputs"

[[bin]]
name = "nota-site-gen"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
pulldown-cmark = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
