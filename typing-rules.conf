# ==========================================
# Symbolic Logic Rules for Typing Transformer
# Note: '|' marks the cursor position; '\|' is a literal pipe character.
# ==========================================

# --- 1. Quine's Dagger (NOR: ↓) & Sheffer Stroke (NAND: ↑) ---
'!v|'          -> '↓|'
':nor|'        -> '↓|'
'\\downarrow|' -> '↓|'

'!^|'          -> '↑|'
':nand|'       -> '↑|'
'\\uparrow|'   -> '↑|'

# --- 2. Conditionals, Non-Implication & Biconditionals ---
# Non-implication (!->) and Converse non-implication (<!-)
'!->|'         -> '↛|'
'¬->|'         -> '↛|'
'<!-|'         -> '↚|'

# Chained negated biconditional (<!->)
'<!->|'        -> '↮|'
'↚>|'          -> '↮|'
'!↔|'          -> '↮|'
'¬↔|'          -> '↮|'

# Preserve HTML/Markdown comments when typing <!-- (since <!- becomes ↚)
'↚-|'          -> '<!--|'

# Standard implication (->), converse (<-), and biconditional (<->)
'<->|'         -> '↔|'
'←>|'          -> '↔|'
'->|'          -> '→|'
'<-|'          -> '←|'

# Double arrows (metalogical / entailment arrows)
'<=>|'         -> '⇔|'
'⇐>|'          -> '⇔|'
'=>|'          -> '⇒|'
'<=|'          -> '⇐|'

# --- 3. Basic Truth-Functional Connectives ---
':not|'        -> '¬|'
'\\neg|'       -> '¬|'
'~~|'          -> '¬|'

':and|'        -> '∧|'
'\\land|'      -> '∧|'
'&&|'          -> '∧|'

':or|'         -> '∨|'
'\\lor|'       -> '∨|'

':xor|'        -> '⊕|'
'\\oplus|'     -> '⊕|'

# --- 4. Turnstiles & Metalogic ---
'!\|-|'        -> '⊬|'
'¬\|-|'        -> '⊬|'
'¬⊢|'          -> '⊬|'
'\|-|'         -> '⊢|'

'!\|=|'        -> '⊭|'
'¬\|=|'        -> '⊭|'
'¬⊨|'          -> '⊭|'
'\|=|'         -> '⊨|'

':top|'        -> '⊤|'
'\\top|'       -> '⊤|'
':bot|'        -> '⊥|'
'\\bot|'       -> '⊥|'
':tf|'         -> '∴|'
'\\therefore|' -> '∴|'
':bc|'         -> '∵|'
'\\because|'   -> '∵|'

# --- 5. Quantifiers & Equivalence ---
':fa|'         -> '∀|'
'\\forall|'    -> '∀|'
':ex|'         -> '∃|'
'\\exists|'    -> '∃|'
'!∃|'          -> '∄|'
'¬∃|'          -> '∄|'
'\\nexists|'   -> '∄|'
'!=|'          -> '≠|'
'≠=|'          -> '≢|'
'===|'         -> '≡|'
'!≡|'          -> '≢|'
'¬≡|'          -> '≢|'
'≡/|'          -> '≢|'
