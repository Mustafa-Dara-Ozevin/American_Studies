name: Deploy Obsidian + Typst Site to GitHub Pages

on:
  push:
    branches:
      - v4
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            site-gen/target/
          key: ${{ runner.os }}-site-gen-${{ hashFiles('site-gen/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-site-gen-

      - name: Build Site Generator
        run: cargo build --release --manifest-path site-gen/Cargo.toml --locked

      - name: Build Static Site
        run: site-gen/target/release/nota-site-gen build --vault . --out public --config site.toml

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
