name: Deploy Nota site to GitHub Pages

on:
  push:
    branches:
      - v4
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vault
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Nota
        uses: actions/checkout@v4
        with:
          repository: Mustafa-Dara-Ozevin/nota
          token: ${{ secrets.NOTA_REPO_TOKEN }}
          path: .nota-src

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .nota-src/target/
          key: ${{ runner.os }}-nota-${{ hashFiles('.nota-src/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nota-

      - name: Install Linux GUI/Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libzstd-dev libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libssl-dev

      - name: Build Nota CLI
        run: cargo build --release --manifest-path .nota-src/Cargo.toml -p nota-cli --locked

      - name: Build Static Site with Nota
        run: .nota-src/target/release/nota build --vault content --out public

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
